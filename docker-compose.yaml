services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/taskflow
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PG_POOL_MAX: 20

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile

    command: ["node", "dist/src/workers/task.worker.js"]

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/taskflow
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PG_POOL_MAX: 10
      WORKER_CONCURRENCY: 2

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine

    container_name: taskflow-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskflow

    ports:
      - "5432:5432"

    volumes:
      - taskflow-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskflow"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine

    container_name: taskflow-redis

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - taskflow-redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  nginx:
    image: nginx:alpine
    container_name: taskflow-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  taskflow-postgres-data:
  taskflow-redis-data:
