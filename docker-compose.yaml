services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: taskflow-api

    ports:
      - "4000:4000"

    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/taskflow
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile

    command: ["node", "dist/src/workers/task.worker.js"]

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/taskflow
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine

    container_name: taskflow-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskflow

    ports:
      - "5432:5432"

    volumes:
      - taskflow-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

    container_name: taskflow-redis

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - taskflow-redis-data:/data

volumes:
  taskflow-postgres-data:
  taskflow-redis-data:
