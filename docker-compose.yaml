services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/taskflow
      REDIS_HOST: redis
      REDIS_PORT: 6379

    deploy:
      resources:
        limits:
          cpus: "0.5"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/ready"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile

    command: ["node", "dist/src/workers/task.worker.js"]

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/taskflow
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine

    container_name: taskflow-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskflow

    ports:
      - "5432:5432"

    volumes:
      - taskflow-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

    container_name: taskflow-redis

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - taskflow-redis-data:/data

  nginx:
    image: nginx:alpine
    container_name: taskflow-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  taskflow-postgres-data:
  taskflow-redis-data:
